{% extends "base.html" %}
{% block content %}

<h1>Clientes</h1>
<a href="{{url_for('nuevo_cliente')}}" class="btn btn-success mb-2">Nuevo</a>

<table class="table table-stiped table-hover">
    <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>Ci</th>
            <th>Acciones</th>
        </tr>

    </thead>
    <tbody>

        {% for item in clientes  %}
        <tr>
            <td>{{ item.cliente_id }}</td>
            <td>{{ item.nombres }}</td>
            <td>{{ item.apellidos }}</td>
            <td>{{ item.ci }}</td>
            <td>
                <a href="{{url_for('editar_cliente', id=item.cliente_id)}}" class="btn btn-warning">Editar</a>
                <a href="{{url_for('eliminar_cliente', id=item.cliente_id)}}" class="btn btn-danger" onclick="return(confirm('Esta seguro eliminar ??'))">Eliminar</a>
            </td>
        </tr>
        {% endfor  %}
    </tbody>
</table>
{% endblock %}
