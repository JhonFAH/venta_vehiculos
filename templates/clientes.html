{% extends "base.html" %}
{% block content %}

<h1>Clientes</h1>
<table class="table table-stiped table-hover">
    <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>Ci</th>
            <th>Acciones</th>
        </tr>

    </thead>
    <tbody>

        {% for cliente in clientes  %}
        <tr>
            <td>{{ cliente.cliente_id }}</td>
            <td>{{ cliente.nombres }}</td>
            <td>{{ cliente.apellidos }}</td>
            <td>{{ cliente.ci }}</td>
            <td></td>
        </tr>
        {% endfor  %}
    </tbody>
</table>
{% endblock %}
