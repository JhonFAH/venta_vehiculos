<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de Vehiculos</title>

    <!-- 1. BOOTSTRAP CSS (Vía CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Venta de Vehiculos</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="{{url_for('clientes')}}">Clientes</a>
                    <a class="nav-link" href="{{url_for('vehiculos')}}">Vehiculos</a>
                    <a class="nav-link" href="{{ url_for('ventas') }}">Ventas</a>
                    
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-4">

        {% block content %}

        {% endblock %}

       
    
    </div>
    
       <!-- 2. BOOTSTRAP JAVASCRIPT (Vía CDN) para componentes interactivos (Modales, desplegables, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
