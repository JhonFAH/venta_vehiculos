{% extends "base.html" %}
{% block content %}

<div class="card">
    <div class="card-header">
        <h2>
            {% if vehiculo %}
                Editar
            {% else %}
                Nuevo
            {% endif %}    
            Vehiculo
        </h2>
    </div>
    <div class="card-body">
        <form action="" method="POST">
            <!-- cuando dejas el atributo action="" vacío en HTML, 
            el navegador por defecto envía el formulario a la misma 
            URL actual en la que estás parado -->

            <div class="mb-3">
                <label for="" class="form-label">Modelo</label>
                <input type="text" class="form-control" name="modelo" value="{{vehiculo.modelo if vehiculo else ''}}">
            </div>
            <div class="mb-3">
                <label for="" class="form-label">Placa</label>
                <input type="text" class="form-control" name="placa" value="{{vehiculo.placa if vehiculo else ''}}">
            </div>
            <div class="mb-3">
                <label for="" class="form-label">Color</label>
                <input type="text" class="form-control" name="color" value="{{vehiculo.color if vehiculo else ''}}">
            </div>

            <button class="btn btn-primary" type="submit">Enviar</button>
            <a href="{{ url_for('ventas') }}" class="btn btn-secondary">Cancelar</a>

        </form>
    </div>
</div>
{% endblock %}
